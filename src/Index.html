<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --bg:#f3ede4; --panel:#fff; --accent:#ff5a5f; --accent2:#4a7bd6;
      --text:#2c2c2c; --muted:#8a8a8a; --border:#e3ddd3;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;color:var(--text);background:var(--bg);
      font-size:16px;line-height:1.6;
      font-family:"UD デジタル教科書体 NK-R","UD Digi Kyokasho NK-R","BIZ UDPGothic","BIZ UDPゴシック",
        "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Maru Gothic Pro",
        "Yu Gothic UI","Yu Gothic Medium","游ゴシック",Meiryo,"メイリオ",sans-serif}

    /* エラーバナー（トーストが消えても内容を読めるよう画面上部に残す） */
    .err-banner{position:fixed;top:0;left:0;right:0;z-index:400;background:#ffe5e5;color:#b00020;
      border-bottom:2px solid #b00020;padding:12px 18px;font-size:15px;font-weight:600;
      display:flex;align-items:center;justify-content:space-between;gap:12px}
    .err-banner .err-text{word-break:break-word}
    .err-banner .err-close{background:transparent;border:none;color:#b00020;font-size:22px;line-height:1;
      cursor:pointer;padding:0 4px}

    #appHeader{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
      background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .header-left{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
    .crumb{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .header-right{display:flex;gap:8px;align-items:center}
    .whoami{font-size:13px;color:var(--muted)}
    main{padding:20px 16px 80px;max-width:1200px;margin:0 auto}

    button{font-family:inherit;cursor:pointer;border-radius:10px;font-size:16px}
    .primary-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;font-weight:600}
    .primary-btn:hover{filter:brightness(.95)}
    .primary-btn:disabled{opacity:.5;cursor:default}
    .ghost-btn{background:transparent;color:var(--text);border:1px solid var(--border);padding:8px 14px}
    .ghost-btn:hover{background:#f6f1ea}
    .danger{color:var(--accent)}

    /* ===== ログイン画面（ヒーロー） ===== */
    body.login-mode{background:linear-gradient(135deg,#5b6cff 0%,#9b5cf6 38%,#e1568f 70%,#ff8a5b 100%);
      background-attachment:fixed}
    body.login-mode #appHeader{display:none}
    body.login-mode main{max-width:none;padding:0 0 60px}
    .login-hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 16px}
    .hero-top{text-align:center;padding:7vh 10px 26px}
    .hero-logo{margin:0;font-weight:900;letter-spacing:2px;line-height:1;
      font-size:clamp(52px,10vw,108px);color:#fff;
      text-shadow:0 1px 0 #cfd0ff,0 2px 0 #c3c4f7,0 3px 0 #b7b8ee,0 4px 0 #abace4,0 5px 0 #9fa0db,
        0 6px 1px rgba(0,0,0,.10),0 0 6px rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.28),0 8px 18px rgba(0,0,0,.30)}
    .hero-badge{font-size:clamp(40px,8vw,80px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
    .hero-sub{color:#fff;font-size:clamp(15px,2.2vw,20px);margin-top:14px;font-weight:600;
      text-shadow:0 2px 6px rgba(0,0,0,.25)}
    .login{width:100%;max-width:960px;margin:0 auto;background:rgba(255,255,255,.97);border-radius:24px;
      padding:26px 30px 34px;box-shadow:0 26px 70px rgba(0,0,0,.30)}
    .login h2{font-size:18px;margin:0 0 16px;text-align:center;color:var(--text)}
    .name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
    .name-btn{padding:14px 8px;border:1px solid var(--border);border-radius:14px;background:#fff;text-align:center;
      font-size:16px;line-height:1.3;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:transform .08s,box-shadow .08s,border-color .08s}
    .name-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.12);border-color:var(--accent2)}
    .name-btn .num{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
    .name-btn .lock{font-size:11px;color:#c0a000}
    .login-foot{margin-top:26px;text-align:center}
    .login-foot .ghost-btn{background:#fff}

    .section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px;gap:10px;flex-wrap:wrap}
    .section-title h2{margin:0;font-size:20px}

    /* ボード一覧 */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .board-card{background:var(--panel);border-radius:14px;padding:18px;cursor:pointer;border:1px solid var(--border);
      transition:transform .1s,box-shadow .1s;position:relative}
    .board-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
    .subject-chip{display:inline-block;background:var(--accent2);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:10px}
    .board-card h3{margin:0 0 6px;font-size:18px}
    .board-card .meta{color:var(--muted);font-size:14px}

    /* ボード（Padlet風） */
    .board-bar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
      border-left:8px solid var(--accent2);border-radius:14px;padding:14px 18px;margin-bottom:18px;gap:10px;flex-wrap:wrap}
    .board-bar .title{font-weight:700;font-size:18px}
    .board-bar .sub{color:var(--muted);font-size:13px}
    .board-bar .bar-actions{display:flex;gap:8px;flex-wrap:wrap}

    /* セクション（横に並ぶ列・列内だけスクロール） */
    #board{display:flex;gap:16px;align-items:stretch;overflow-x:auto;
      height:calc(100vh - 184px);min-height:320px;padding-bottom:6px}
    body:not(.login-mode) main:has(#board){padding-bottom:16px}
    .section-col{flex:0 0 286px;background:rgba(255,255,255,.55);border:1px solid var(--border);
      border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
    /* 固定ヘッダー（＋ボタンが上、その下にタイトル） */
    .col-header{flex:0 0 auto;padding:10px 12px 8px;background:rgba(255,255,255,.75);border-bottom:1px solid var(--border)}
    .add-bar{display:block;width:100%;border:1px dashed var(--accent2);background:#fff;color:var(--accent2);
      border-radius:10px;padding:7px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
    .add-bar:hover{background:var(--accent2);color:#fff}
    .col-title{display:flex;align-items:center;justify-content:space-between;gap:6px}
    .col-title .sec-name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .col-title .count{color:var(--muted);font-weight:400;font-size:13px;margin-left:4px}
    .sec-tools button{border:none;background:transparent;cursor:pointer;font-size:14px;padding:2px 4px}
    .card-list{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}

    .card{width:100%;border-radius:14px;padding:12px 12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.10);position:relative;
      background:#fff7c0;cursor:grab}
    .card .vid{width:100%;height:160px;border:0;border-radius:10px;margin-top:8px;display:block}
    .card.dragging{opacity:.4}
    .card.pinned{box-shadow:0 0 0 2px var(--accent2),0 3px 10px rgba(0,0,0,.14)}
    .pin-strip{font-size:11px;color:var(--accent2);font-weight:700;margin:-2px 0 6px}
    /* 投稿者（小さめ） */
    .card .meta-row{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:4px;padding-right:44px}
    .card .meta-row .who{font-weight:600;color:#555}
    .card .card-title{font-weight:700;font-size:16px;line-height:1.4;margin:2px 0 2px;word-break:break-word}
    .card .body{font-size:15px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
    .card img.photo{width:100%;border-radius:10px;margin-top:8px;display:block}
    .card .time{color:rgba(0,0,0,.40);font-size:11px;margin-top:6px}
    /* 右上の⋮メニュー */
    .card .tools{position:absolute;top:6px;right:6px}
    .card .tools .t-menu{background:rgba(255,255,255,.6);border:none;border-radius:7px;cursor:pointer;
      font-size:17px;line-height:1;padding:2px 7px;opacity:.55;color:#444}
    .card .tools .t-menu:hover{opacity:1}
    .card .menu{position:absolute;right:0;top:28px;background:#fff;border:1px solid var(--border);
      border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.18);z-index:20;min-width:140px;overflow:hidden}
    .card .menu button{display:block;width:100%;text-align:left;background:#fff;border:none;
      padding:9px 12px;font-size:14px;cursor:pointer}
    .card .menu button:hover{background:#f3eee6}
    .card .menu button.danger{color:var(--accent)}
    .card-actions{display:flex;gap:12px;margin-top:8px;font-size:14px;align-items:center}
    .card-actions .act{cursor:pointer;user-select:none;background:rgba(255,255,255,.5);border:none;border-radius:8px;padding:3px 8px}
    .card-actions .act.liked{color:var(--accent);font-weight:700}
    .comments{margin-top:8px;border-top:1px solid rgba(0,0,0,.08);padding-top:6px}
    .comment{font-size:13px;margin-bottom:4px;line-height:1.4}
    .comment b{font-weight:700}
    .comment-form{display:flex;gap:6px;margin-top:6px}
    .comment-form input{flex:1;padding:6px 8px;border:1px solid rgba(0,0,0,.15);border-radius:8px;font-size:13px;font-family:inherit;background:rgba(255,255,255,.7)}
    .comment-form button{border:none;background:var(--accent2);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}

    .fab{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;background:var(--accent);
      color:#fff;border:none;font-size:30px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:40}

    /* モーダル */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
    .modal-card{background:var(--panel);border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
    .modal-card h3{margin:0 0 16px}
    .field{display:block;margin-bottom:14px}
    .field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    .field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px}
    .preview{width:100%;border-radius:10px;margin-bottom:14px}
    .color-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
    .swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
    .swatch.active{border-color:#333}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px}

    /* 先生 */
    .teacher-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .tab{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--panel)}
    .tab.active{background:var(--text);color:#fff;border-color:var(--text)}
    table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
    th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:15px}
    th{background:#faf6f0;color:var(--muted);font-weight:600}
    .row-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:16px 0}
    .row-form .field{margin-bottom:0;flex:1;min-width:140px}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;
      padding:12px 20px;border-radius:10px;z-index:300;font-size:14px}
    .empty{text-align:center;color:var(--muted);padding:48px 16px}
    .spinner{text-align:center;padding:48px;color:var(--muted)}
    .hidden{display:none!important}

    /* 印刷 */
    #printArea{display:none}
    @media print{
      #appHeader,main,.fab,.modal,.toast{display:none!important}
      #printArea{display:block!important;padding:0}
      .print-card{border:1px solid #ccc;border-radius:8px;padding:10px;margin-bottom:10px;break-inside:avoid}
      .print-card img{max-width:300px;display:block;margin-top:6px}
      .print-head{margin-bottom:14px}
      .print-group{margin-bottom:18px}
    }
    #printArea h1{font-size:20px}
    #printArea h2{font-size:16px;margin:14px 0 8px}
    .print-card .pmeta{font-size:12px;color:#666}
  </style>
</head>
<body>
  <header id="appHeader">
    <div class="header-left">
      <span class="logo" onclick="App.home()">📚 Manabase</span>
      <span id="crumb" class="crumb"></span>
    </div>
    <div class="header-right">
      <span id="whoami" class="whoami"></span>
      <button id="logoutBtn" class="ghost-btn hidden" onclick="App.logout()">ログアウト</button>
    </div>
  </header>

  <main id="view"></main>

  <div id="modalRoot"></div>
  <div id="printArea"></div>
  <div id="toast" class="toast hidden"></div>

<script>
// ============================================================
//  クライアント（単一ファイル）
// ============================================================
var App = (function(){
  var COLORS = ['#fff7c0','#ffd1dc','#c8f0d0','#cfe3ff','#e8d6ff','#ffe2bf','#ffffff'];
  // セクションの色分け用パレット（先生が選ぶ）
  var SECTION_COLORS = ['#e8554e','#e08a3c','#d9a400','#2faf6b','#2796a8','#3f7fd6','#8c5bd0','#d24b8c','#7a8b3c','#6a7a8c'];
  function hexToRgba(hex,a){
    hex=String(hex||'').replace('#',''); if(hex.length===3)hex=hex.replace(/./g,'$&$&');
    var n=parseInt(hex,16); if(isNaN(n))return 'transparent';
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  // 教科ごとの色（ボードの色分け用）
  var SUBJECT_COLORS = {
    '国語':'#e8554e','算数・数学':'#3f7fd6','理科':'#2faf6b','社会':'#c8862a',
    '英語':'#8c5bd0','生活':'#e08a3c','音楽':'#d24b8c','図工・美術':'#d98c00',
    '体育':'#2796a8','家庭科':'#b5527a','道徳':'#7a8b3c','総合':'#5a6b8c',
    '学活':'#6a8caf','その他':'#7f8c8d'
  };
  function subjColor(s){
    if(SUBJECT_COLORS[s]) return SUBJECT_COLORS[s];
    var h=0; s=String(s||''); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))&0xffffff;
    return 'hsl('+(h%360)+',52%,48%)';
  }
  var user = null;          // {name, password} 生徒
  var teacherPass = null;   // 先生パスワード（先生ログイン時）
  var current = { board:null, cards:[], sections:[], boards:[], students:[] };
  var dragEl = null;
  var pollTimer = null;   // リアルタイム更新用タイマー
  var lastSig = '';       // 直近のボード状態シグネチャ

  var $ = function(id){ return document.getElementById(id); };
  var view = function(){ return $('view'); };
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function spinner(){ var b=$('errBanner'); if(b)b.classList.add('hidden'); view().innerHTML='<div class="spinner">読み込み中…</div>'; }
  function setCrumb(t){ $('crumb').textContent = t ? '/ '+t : ''; }
  function toast(m){var t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.add('hidden');},2600);}
  function fmt(d){if(d==null||d==='')return '';var x=new Date(d);if(isNaN(x))return '';return (x.getMonth()+1)+'/'+x.getDate()+' '+('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2);}
  function run(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,a);});}
  function errMsg(e){return (e&&e.message)?e.message:(e==null?'不明なエラー':String(e));}
  function err(e){
    console.error(e);
    var m=errMsg(e);
    toast('エラー: '+m);
    // トーストは数秒で消えるため、画面上部に消えない赤字バナーも表示して内容を読めるようにする
    showErrorBanner(m);
  }
  function showErrorBanner(m){
    var bar=$('errBanner');
    if(!bar){
      bar=document.createElement('div');
      bar.id='errBanner';
      bar.className='err-banner';
      document.body.appendChild(bar);
    }
    bar.innerHTML='<span class="err-text"></span><button class="err-close" title="閉じる">×</button>';
    bar.querySelector('.err-text').textContent='⚠ エラー: '+m;
    bar.querySelector('.err-close').onclick=function(){bar.classList.add('hidden');};
    bar.classList.remove('hidden');
  }

  // -------- モーダル --------
  function modal(html){ $('modalRoot').innerHTML = '<div class="modal"><div class="modal-card">'+html+'</div></div>'; }
  function closeModal(){ $('modalRoot').innerHTML=''; }

  // ============== ログイン ==============
  function home(){
    if(teacherPass){ Teacher.open(); return; }
    if(user){ boardList(); return; }
    login();
  }
  function login(){
    stopPolling();
    user=null; teacherPass=null; setCrumb(''); updateHeader();
    document.body.classList.add('login-mode');
    // ヒーローは即時表示（読み込み待ちの体感を減らす）。名前一覧だけ後から差し込む。
    view().innerHTML=
      '<div class="login-hero"><div style="width:100%;max-width:960px">'
      +'<div class="hero-top"><div class="hero-badge">📚</div>'
      +'<h1 class="hero-logo">Manabase</h1>'
      +'<div class="hero-sub">学びを、みんなで残そう。</div></div>'
      +'<div class="login"><h2>自分の名前を選んでログイン</h2>'
      +'<div id="nameGrid" class="name-grid"><div class="spinner" style="grid-column:1/-1">読み込み中…</div></div>'
      +'<div class="login-foot" id="loginFoot"></div>'
      +'</div></div></div>';
    run('getLoginInfo').then(function(info){
      var grid=$('nameGrid'); if(grid) grid.innerHTML='';
      if(!info.students.length){
        if(grid) grid.innerHTML='<div class="empty" style="grid-column:1/-1">まだ名簿が登録されていません。<br>先生用ログインから名簿を登録してください。</div>';
      }else if(grid){
        info.students.forEach(function(s){
          var btn=document.createElement('button');
          btn.className='name-btn';
          btn.innerHTML=(s.number?'<span class="num">'+esc(s.number)+'番</span>':'')+esc(s.name)
            +(s.hasPassword?'':'<span class="lock">★初回</span>');
          btn.addEventListener('click',function(){ pickName(s); });
          grid.appendChild(btn);
        });
      }
      var foot=$('loginFoot');
      if(foot) foot.innerHTML='<button class="ghost-btn" onclick="App.teacherLogin()">🧑‍🏫 先生用ログイン'
        +(info.teacherSet?'':'（初回設定）')+'</button>';
    }).catch(err);
  }
  function exitLoginMode(){ document.body.classList.remove('login-mode'); }

  function pickName(s){
    if(s.hasPassword){
      modal('<h3>'+esc(s.name)+' のログイン</h3>'
        +'<label class="field"><span>パスワード</span><input id="pw" type="password" autocomplete="off"></label>'
        +'<div class="modal-actions"><button class="ghost-btn" onclick="App.closeModal()">やめる</button>'
        +'<button class="primary-btn" onclick="App.doLogin('+JSON.stringify(s.name).replace(/"/g,'&quot;')+')">ログイン</button></div>');
    }else{
      modal('<h3>'+esc(s.name)+' の初回ログイン</h3><p style="color:var(--muted);font-size:13px">自分だけのパスワードを決めてね（次回からこれでログイン）</p>'
        +'<label class="field"><span>パスワードを設定</span><input id="pw" type="password" autocomplete="off"></label>'
        +'<label class="field"><span>もう一度入力</span><input id="pw2" type="password" autocomplete="off"></label>'
        +'<div class="modal-actions"><button class="ghost-btn" onclick="App.closeModal()">やめる</button>'
        +'<button class="primary-btn" onclick="App.doLogin('+JSON.stringify(s.name).replace(/"/g,'&quot;')+',true)">設定してログイン</button></div>');
    }
    setTimeout(function(){var e=$('pw');if(e)e.focus();},50);
  }
  function doLogin(name, isNew){
    var pw=$('pw').value;
    if(!pw){toast('パスワードを入力してください');return;}
    if(isNew){ if(pw!==$('pw2').value){toast('パスワードが一致しません');return;} }
    run('studentLogin',name,pw).then(function(r){
      user={name:name,password:pw}; teacherPass=null;
      closeModal(); exitLoginMode(); updateHeader();
      if(r.firstTime) toast('パスワードを設定しました！');
      boardList();
    }).catch(err);
  }
  function teacherLogin(){
    modal('<h3>先生用ログイン</h3><p style="color:var(--muted);font-size:13px">初回は入力したものがパスワードとして設定されます。</p>'
      +'<label class="field"><span>パスワード</span><input id="tpw" type="password" autocomplete="off"></label>'
      +'<div class="modal-actions"><button class="ghost-btn" onclick="App.closeModal()">やめる</button>'
      +'<button class="primary-btn" onclick="App.doTeacherLogin()">ログイン</button></div>');
    setTimeout(function(){var e=$('tpw');if(e)e.focus();},50);
  }
  function doTeacherLogin(){
    var pw=$('tpw').value; if(!pw){toast('パスワードを入力してください');return;}
    run('teacherLogin',pw).then(function(r){
      teacherPass=pw; user=null; closeModal(); exitLoginMode(); updateHeader();
      if(r.firstTime) toast('先生用パスワードを設定しました');
      Teacher.open();
    }).catch(err);
  }
  function logout(){ user=null; teacherPass=null; login(); }
  function updateHeader(){
    var w=$('whoami'), b=$('logoutBtn');
    if(user){ w.textContent='👤 '+user.name; b.classList.remove('hidden'); }
    else if(teacherPass){ w.textContent='🧑‍🏫 先生'; b.classList.remove('hidden'); }
    else { w.textContent=''; b.classList.add('hidden'); }
  }

  // ============== 生徒：ボード一覧 ==============
  function boardList(){
    stopPolling();
    current.board=null; setCrumb('ボード一覧'); spinner();
    run('getBoards').then(function(boards){
      boards=boards||[];
      current.boards=boards;
      var html='<div class="section-title"><h2>ボード</h2></div>';
      if(!boards.length){ html+='<div class="empty">まだボードがありません。<br>先生がボードを作るとここに出ます。</div>'; }
      else{
        html+='<div class="grid">';
        boards.forEach(function(b){
          var col=subjColor(b.subject);
          html+='<div class="board-card" style="border-top:6px solid '+col+'" onclick="App.openBoard('+JSON.stringify(b.boardId).replace(/"/g,'&quot;')+')">'
            +'<span class="subject-chip" style="background:'+col+'">'+esc(b.subject)+'</span>'
            +'<h3>'+esc(b.title)+'</h3>'
            +'<div class="meta">'+esc(b.unit)+' ・ '+esc(b.date)+'</div></div>';
        });
        html+='</div>';
      }
      view().innerHTML=html;
    }).catch(err);
  }

  // ============== 生徒：ボード（Padlet風・セクション対応） ==============
  function applyBoardData(data){
    current.board=data.board;
    current.sections=data.sections||[];
    current.cards=data.cards||[];
  }
  function clientCardCmp(a,b){
    if(!!a.pinned!==!!b.pinned) return a.pinned?-1:1;
    if(a.sortOrder!==b.sortOrder) return a.sortOrder-b.sortOrder;
    return (a.createdAt||0)-(b.createdAt||0);
  }
  function openBoard(boardId){
    stopPolling();
    spinner();
    run('getBoardData',boardId,user?user.name:null).then(function(data){
      applyBoardData(data);
      setCrumb('ボード › '+data.board.title);
      renderBoard();
      startPolling(boardId);
    }).catch(err);
  }

  function renderBoard(){
    var b=current.board, col=subjColor(b.subject);
    var isTeacher=!!teacherPass;
    var bar='<div class="board-bar" style="border-left-color:'+col+'">'
      +'<div><div class="title">'+esc(b.title)+'</div>'
      +'<div class="sub">'+esc(b.subject)+' ・ '+esc(b.unit)+' ・ '+esc(b.date)+'</div></div>'
      +'<div class="bar-actions">'
      +(isTeacher?'<button class="ghost-btn" onclick="App.addSection()">＋ セクション</button>':'')
      +'<button class="ghost-btn" onclick="App.refreshBoard()">↻ 更新</button>'
      +'<button class="ghost-btn" onclick="App.leaveBoard()">← ボード一覧</button>'
      +'</div></div>';
    view().innerHTML=bar+'<div id="board"></div>';
    var board=$('board');

    // セクションごとにカードを振り分け
    var bySection={};
    current.cards.forEach(function(c){ (bySection[c.sectionId||'']=bySection[c.sectionId||'']||[]).push(c); });

    var cols=current.sections.slice();
    // どのセクションにも属さないカードがあれば「未分類」列を末尾に
    if((bySection['']||[]).length){ cols.push({sectionId:'',name:'（未分類）',_none:true}); }
    if(!cols.length){ cols.push({sectionId:'',name:'みんなの投稿'}); }

    cols.forEach(function(sec){ board.appendChild(buildColumn(sec, bySection[sec.sectionId]||[], isTeacher)); });
    setupDnD(board);
    lastSig=computeSig();
  }

  function buildColumn(sec, cards, isTeacher){
    var colEl=document.createElement('div');
    colEl.className='section-col'; colEl.dataset.sectionId=sec.sectionId;

    // セクション色（先生が設定）。色があれば上部にアクセントバー＋ヘッダーを淡く着色。
    var color=sec.color||'';
    if(color){ colEl.style.borderTop='5px solid '+color; }

    // 固定ヘッダー：タイトルが上、その下に＋ボタン（スクロールしても動かない）
    var head=document.createElement('div'); head.className='col-header';
    if(color){ head.style.background=hexToRgba(color,0.16); }
    var tools='';
    if(isTeacher && !sec._none){
      tools='<span class="sec-tools"><button title="色を変える" data-act="color">🎨</button>'
        +'<button title="名前を変更" data-act="rename">✏</button>'
        +'<button title="削除" data-act="del">🗑</button></span>';
    }
    var addBtn = (!sec._none && user) ? '<button class="add-bar" data-act="add">＋ 投稿</button>' : '';
    head.innerHTML='<div class="col-title"><span class="sec-name">'+esc(sec.name)
      +'<span class="count">'+cards.length+'</span></span>'+tools+'</div>'
      +addBtn;
    colEl.appendChild(head);
    if(addBtn) head.querySelector('[data-act="add"]').addEventListener('click',function(){ openPost(sec.sectionId); });
    if(isTeacher && !sec._none){
      head.querySelector('[data-act="color"]').addEventListener('click',function(){ pickSectionColor(sec); });
      head.querySelector('[data-act="rename"]').addEventListener('click',function(){ renameSection(sec); });
      head.querySelector('[data-act="del"]').addEventListener('click',function(){ deleteSection(sec); });
    }

    var list=document.createElement('div'); list.className='card-list'; list.dataset.sectionId=sec.sectionId;
    cards.slice().sort(clientCardCmp).forEach(function(c){ list.appendChild(cardEl(c)); });
    colEl.appendChild(list);
    return colEl;
  }

  function refreshBoard(){ if(current.board) openBoard(current.board.boardId); }
  function leaveBoard(){ stopPolling(); current.board=null; home(); }

  function cardEl(r){
    var d=document.createElement('div');
    d.className='card'+(r.pinned?' pinned':''); d.style.background=r.color||'#fff7c0';
    d.setAttribute('draggable','true'); d.dataset.id=r.reflectionId;
    var canEdit = teacherPass || (user && user.name===r.studentName);
    var media='';
    if(r.photoUrl){
      if(r.mediaType==='video') media='<iframe class="vid" src="'+esc(r.photoUrl)+'" allow="autoplay" allowfullscreen></iframe>';
      else media='<img class="photo" src="'+esc(r.photoUrl)+'" loading="lazy" referrerpolicy="no-referrer">';
    }
    // 右上の⋮メニュー（ピン留め・編集・削除）
    var tools=canEdit
      ? '<div class="tools"><button class="t-menu" title="メニュー">⋮</button>'
        +'<div class="menu hidden">'
        +'<button class="m-pin">'+(r.pinned?'📌 ピン留めを解除':'📌 ピン留め')+'</button>'
        +'<button class="m-edit">✏️ 編集</button>'
        +'<button class="m-del danger">🗑️ 削除</button>'
        +'</div></div>'
      : '';
    var html=tools
      +(r.pinned?'<div class="pin-strip">📌 ピン留め</div>':'')
      +'<div class="meta-row"><span class="who">'+esc(r.studentName)+'</span><span>'+fmt(r.createdAt)
        +(r.updatedAt&&r.updatedAt>r.createdAt?'（編集済み）':'')+'</span></div>'
      +(r.title?'<div class="card-title">'+esc(r.title)+'</div>':'')
      +(r.text?'<div class="body">'+esc(r.text)+'</div>':'')
      +media
      +'<div class="card-actions">'
      +'<button class="act like'+(r.likedByMe?' liked':'')+'">❤ <span class="lc">'+r.likeCount+'</span></button>'
      +'</div>'
      +'<div class="comments"></div>';
    d.innerHTML=html;

    d.querySelector('.like').addEventListener('click',function(e){e.stopPropagation();like(r,d);});
    if(canEdit){
      var menu=d.querySelector('.menu');
      d.querySelector('.t-menu').addEventListener('click',function(e){
        e.stopPropagation();
        var willOpen=menu.classList.contains('hidden');
        closeAllMenus();
        if(willOpen) menu.classList.remove('hidden');
      });
      d.querySelector('.m-pin').addEventListener('click',function(e){e.stopPropagation();closeAllMenus();togglePinCard(r);});
      d.querySelector('.m-edit').addEventListener('click',function(e){e.stopPropagation();closeAllMenus();openEdit(r);});
      d.querySelector('.m-del').addEventListener('click',function(e){e.stopPropagation();closeAllMenus();delCard(r);});
    }
    renderComments(r,d); // コメントは常時表示
    return d;
  }

  function findCard(id){ for(var i=0;i<current.cards.length;i++){ if(current.cards[i].reflectionId===id) return current.cards[i]; } return null; }
  function cardNode(id){ return document.querySelector('.card[data-id="'+id+'"]'); }
  function closeAllMenus(){ [].forEach.call(document.querySelectorAll('.card .menu'),function(m){m.classList.add('hidden');}); }
  document.addEventListener('click',closeAllMenus);
  function insertCardDom(card){
    var board=$('board'); if(!board){ refreshBoard(); return; }
    var list=board.querySelector('.card-list[data-section-id="'+(card.sectionId||'')+'"]');
    if(!list){ refreshBoard(); return; }  // 既定セクションがサーバ側で新規作成された等 → 全体再取得
    list.appendChild(cardEl(card));
  }
  function replaceCardDom(card){
    var old=cardNode(card.reflectionId);
    if(old && old.parentNode){ old.parentNode.replaceChild(cardEl(card),old); } else { refreshBoard(); }
  }

  // 楽観的いいね（先にUI更新→裏で保存）
  function like(r,d){
    if(!user){toast('いいねは生徒ログインが必要です');return;}
    var nl=!r.likedByMe; r.likedByMe=nl; r.likeCount=Math.max(0,r.likeCount+(nl?1:-1));
    var btn=d.querySelector('.like'); btn.classList.toggle('liked',nl); d.querySelector('.lc').textContent=r.likeCount;
    lastSig=computeSig();
    run('toggleLike',r.reflectionId,user.name,user.password).then(function(res){
      r.likeCount=res.count; r.likedByMe=res.liked;
      btn.classList.toggle('liked',res.liked); d.querySelector('.lc').textContent=res.count; lastSig=computeSig();
    }).catch(function(e){
      r.likedByMe=!nl; r.likeCount=Math.max(0,r.likeCount+(nl?-1:1));
      btn.classList.toggle('liked',r.likedByMe); d.querySelector('.lc').textContent=r.likeCount; err(e);
    });
  }

  // ピン留め（楽観的：先に並べ替えてから保存）
  function togglePinCard(r){
    if(!user && !teacherPass)return;
    var np=!r.pinned; r.pinned=np; r.updatedAt=Date.now();
    renderBoard();
    run('togglePin',r.reflectionId,user?user.name:null,user?user.password:null,teacherPass)
      .then(function(res){ r.pinned=res.pinned; lastSig=computeSig(); })
      .catch(function(e){ r.pinned=!np; renderBoard(); err(e); });
  }
  // コメントは投稿の下に常時表示
  function renderComments(r,d){
    var box=d.querySelector('.comments');
    var html=r.comments.map(function(c){return '<div class="comment"><b>'+esc(c.author)+'</b>：'+esc(c.text)+'</div>';}).join('');
    if(user){
      html+='<div class="comment-form"><input placeholder="コメントを追加…"><button>送信</button></div>';
    }
    box.innerHTML=html;
    if(user){
      var input=box.querySelector('input'), btn=box.querySelector('button');
      var send=function(){
        var t=input.value.trim(); if(!t)return; btn.disabled=true;
        run('addComment',r.reflectionId,user.name,user.password,t).then(function(list){
          r.comments=list; renderComments(r,d); lastSig=computeSig();
        }).catch(function(e){err(e);btn.disabled=false;});
      };
      btn.addEventListener('click',send);
      input.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
    }
  }
  function delCard(r){
    if(!confirm('この投稿を削除しますか？'))return;
    var node=cardNode(r.reflectionId); if(node)node.remove();
    current.cards=current.cards.filter(function(c){return c.reflectionId!==r.reflectionId;});
    lastSig=computeSig();
    run('deleteReflection',r.reflectionId,user?user.name:null,user?user.password:null,teacherPass)
      .catch(function(e){ err(e); refreshBoard(); });
  }

  // -------- ドラッグ＆ドロップ（セクション間移動・並べ替え） --------
  function setupDnD(boardEl){
    boardEl.addEventListener('dragstart',function(e){
      // 入力欄・ボタン・コメント操作中はドラッグを開始しない
      if(e.target.closest('input,textarea,button,.comments')){ e.preventDefault(); return; }
      var card=e.target.closest('.card'); if(!card)return;
      dragEl=card; setTimeout(function(){card.classList.add('dragging');},0);
    });
    boardEl.addEventListener('dragend',function(){
      if(!dragEl)return; dragEl.classList.remove('dragging'); dragEl=null; saveLayout(boardEl);
    });
    boardEl.addEventListener('dragover',function(e){
      if(!dragEl)return;
      var list=e.target.closest('.card-list'); if(!list)return;
      e.preventDefault();
      var after=dragAfter(list,e.clientY);
      if(after==null) list.appendChild(dragEl); else list.insertBefore(dragEl,after);
    });
  }
  function dragAfter(list,y){
    var els=[].slice.call(list.querySelectorAll('.card:not(.dragging)'));
    var best=null, bestOff=-Infinity;
    els.forEach(function(c){
      var rect=c.getBoundingClientRect(); var off=y-(rect.top+rect.height/2);
      if(off<0 && off>bestOff){ bestOff=off; best=c; }
    });
    return best;
  }
  function saveLayout(boardEl){
    var items=[];
    [].slice.call(boardEl.querySelectorAll('.card-list')).forEach(function(list){
      var sid=list.dataset.sectionId||'';
      [].slice.call(list.querySelectorAll('.card')).forEach(function(card){ items.push({id:card.dataset.id,sectionId:sid}); });
    });
    // ローカルの current.cards にも反映（次のポーリング比較がブレないように）
    var map={}; items.forEach(function(it,i){ map[it.id]={sec:it.sectionId,ord:i+1}; });
    current.cards.forEach(function(c){ if(map[c.reflectionId]){ c.sectionId=map[c.reflectionId].sec; c.sortOrder=map[c.reflectionId].ord; } });
    lastSig=computeSig();
    run('updateLayout',current.board.boardId,items).catch(err);
  }

  // -------- セクション管理（先生） --------
  function addSection(){
    var name=prompt('新しいセクション名'); if(name==null)return; name=name.trim(); if(!name)return;
    // 既存セクション数で色を順番に割り当て（あとから🎨で変更可）
    var color=SECTION_COLORS[current.sections.length % SECTION_COLORS.length];
    run('createSection',current.board.boardId,name,teacherPass,color).then(function(){ refreshBoard(); }).catch(err);
  }
  function pickSectionColor(sec){
    var sw=SECTION_COLORS.map(function(c){
      return '<div class="swatch'+(c===sec.color?' active':'')+'" style="background:'+c+'" data-c="'+c+'"></div>';
    }).join('')
    +'<div class="swatch'+(!sec.color?' active':'')+'" style="background:#fff;border:1px solid #ddd;font-size:11px;display:flex;align-items:center;justify-content:center" data-c="">なし</div>';
    modal('<h3>「'+esc(sec.name)+'」の色</h3><div class="color-row" id="secColors">'+sw+'</div>'
      +'<div class="modal-actions"><button class="ghost-btn" onclick="App.closeModal()">閉じる</button></div>');
    [].forEach.call($('secColors').children,function(el){
      el.addEventListener('click',function(){
        var c=el.dataset.c;
        run('setSectionColor',sec.sectionId,c,teacherPass).then(function(){ closeModal(); refreshBoard(); }).catch(err);
      });
    });
  }
  function renameSection(sec){
    var name=prompt('セクション名を変更',sec.name); if(name==null)return; name=name.trim(); if(!name)return;
    run('renameSection',sec.sectionId,name,teacherPass).then(function(){ refreshBoard(); }).catch(err);
  }
  function deleteSection(sec){
    if(!confirm('セクション「'+sec.name+'」を削除しますか？\n中の投稿は「未分類」に移ります。'))return;
    run('deleteSection',sec.sectionId,teacherPass).then(function(){ refreshBoard(); }).catch(err);
  }

  // -------- リアルタイム更新（ポーリング） --------
  function computeSig(){
    var maxMs=0, likes=0, coms=0;
    current.cards.forEach(function(c){
      var u=(c.updatedAt||c.createdAt||0); if(u>maxMs)maxMs=u;
      likes+=c.likeCount||0; coms+=(c.comments?c.comments.length:0);
    });
    return current.cards.length+'|'+maxMs+'|'+current.sections.length+'|'+likes+'|'+coms;
  }
  function busy(){
    if($('modalRoot').innerHTML) return true;
    if(dragEl) return true;
    var a=document.activeElement;
    if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')) return true;
    return false;
  }
  function startPolling(boardId){
    stopPolling();
    pollTimer=setInterval(function(){
      if(!current.board||current.board.boardId!==boardId) return;
      if(document.hidden || busy()) return;
      run('getBoardSignature',boardId).then(function(sig){
        if(sig!==lastSig){
          run('getBoardData',boardId,user?user.name:null).then(function(data){
            if(!current.board||current.board.boardId!==boardId) return;
            if(busy()) return; // 取得中に操作が始まったら今回はスキップ
            applyBoardData(data); renderBoard();
          }).catch(function(){});
        }
      }).catch(function(){});
    },7000);
  }
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

  // -------- 投稿／編集モーダル（写真・動画・カメラ） --------
  var mode='post';            // 'post' | 'edit'
  var postSectionId='';       // 投稿先セクション
  var editTarget=null;        // 編集対象カード
  var pendingMedia=null;      // {data,mimeType,filename,kind,previewUrl}
  var pickedColor=COLORS[0];
  var removeExisting=false;

  function openPost(sectionId){
    if(!user){toast('投稿は生徒ログインが必要です');return;}
    mode='post'; postSectionId=sectionId||''; editTarget=null;
    pendingMedia=null; removeExisting=false; pickedColor=COLORS[0];
    showMediaModal('投稿する','','');
  }
  function openEdit(card){
    mode='edit'; editTarget=card;
    pendingMedia=null; removeExisting=false; pickedColor=card.color||COLORS[0];
    showMediaModal('保存する',card.title||'',card.text||'');
  }

  function showMediaModal(okLabel,titleVal,textVal){
    var heading=(mode==='edit')?'<h3>投稿を編集</h3>':'';
    var html=heading
      +'<label class="field"><span>タイトル（任意・太字で表示）</span><input id="mTitle" type="text" placeholder="タイトル" value="'+esc(titleVal)+'"></label>'
      +'<label class="field"><span>本文</span><textarea id="mText" rows="4" placeholder="本文を入力（タイトルだけ・写真だけでもOK）">'+esc(textVal)+'</textarea></label>'
      +'<label class="field"><span>写真・動画（任意）</span><input type="file" id="mFile" accept="image/*,video/*"></label>'
      +'<div style="margin:-6px 0 12px;display:flex;gap:8px;flex-wrap:wrap">'
      +'<button type="button" class="ghost-btn" onclick="App.capture(\'image\')">📷 写真を撮る</button>'
      +'<button type="button" class="ghost-btn" onclick="App.capture(\'video\')">🎥 動画を撮る</button>'
      +'</div>'
      // 端末標準のカメラを直接起動（capture属性）。GASのiframe内でも動くため getUserMedia より確実。
      +'<input type="file" id="mCapImg" accept="image/*" capture="environment" class="hidden">'
      +'<input type="file" id="mCapVid" accept="video/*" capture="environment" class="hidden">'
      +'<div id="mPrev" style="margin-bottom:12px"></div>'
      +(mode==='edit'?'<div id="mRemoveWrap" style="margin-bottom:12px"></div>':'')
      +'<div class="color-row" id="cRow"></div>'
      +'<div class="modal-actions"><button class="ghost-btn" onclick="App.closeModal()">キャンセル</button>'
      +'<button class="primary-btn" id="mSubmit" onclick="App.submitMedia()">'+okLabel+'</button></div>';
    modal(html);
    var row=$('cRow');
    row.innerHTML=COLORS.map(function(c){return '<div class="swatch'+(c===pickedColor?' active':'')+'" style="background:'+c+';'+(c==='#ffffff'?'border:1px solid #ddd':'')+'" data-c="'+c+'"></div>';}).join('');
    [].forEach.call(row.children,function(sw){sw.addEventListener('click',function(){pickedColor=sw.dataset.c;[].forEach.call(row.children,function(x){x.classList.remove('active');});sw.classList.add('active');});});
    $('mFile').addEventListener('change',onFile);
    $('mCapImg').addEventListener('change',onFile);
    $('mCapVid').addEventListener('change',onFile);
    renderMediaPreview();
  }

  // 端末のカメラで撮影（写真／動画）。capture属性付きファイル入力を起動するだけ。
  function capture(kind){
    var el=$(kind==='video'?'mCapVid':'mCapImg');
    if(el){ el.value=''; el.click(); }
  }

  function onFile(e){
    var f=e.target.files[0]; if(!f){return;}
    var isVideo=/^video\//.test(f.type);
    if(isVideo){
      if(f.size>20*1024*1024){toast('動画が大きすぎます（20MBまで）。短く撮ってね');e.target.value='';return;}
      var reader=new FileReader();
      reader.onload=function(ev){
        pendingMedia={data:ev.target.result.split(',')[1],mimeType:f.type||'video/mp4',filename:f.name||'video.mp4',kind:'video',previewUrl:URL.createObjectURL(f)};
        removeExisting=false; renderMediaPreview();
      };
      reader.readAsDataURL(f);
    }else{
      compress(f,1280,0.82).then(function(p){
        pendingMedia={data:p.data,mimeType:p.mimeType,filename:p.filename,kind:'image',previewUrl:p.dataUrl};
        removeExisting=false; renderMediaPreview();
      }).catch(err);
    }
  }
  function compress(file,maxDim,quality){
    return new Promise(function(res,rej){
      var img=new Image(); var url=URL.createObjectURL(file);
      img.onload=function(){
        var w=img.width,h=img.height;
        if(w>h && w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
        else if(h>=w && h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        var dataUrl=cv.toDataURL('image/jpeg',quality);
        res({dataUrl:dataUrl,data:dataUrl.split(',')[1],mimeType:'image/jpeg',filename:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg'});
      };
      img.onerror=rej; img.src=url;
    });
  }
  function renderMediaPreview(){
    var el=$('mPrev'); if(!el)return;
    if(pendingMedia){
      el.innerHTML=(pendingMedia.kind==='video')
        ?'<video src="'+pendingMedia.previewUrl+'" controls style="width:100%;border-radius:10px"></video>'
        :'<img src="'+pendingMedia.previewUrl+'" style="width:100%;border-radius:10px">';
    }else if(mode==='edit'&&editTarget&&editTarget.photoUrl&&!removeExisting){
      el.innerHTML=(editTarget.mediaType==='video')
        ?'<iframe src="'+esc(editTarget.photoUrl)+'" class="vid" style="height:200px"></iframe>'
        :'<img src="'+esc(editTarget.photoUrl)+'" referrerpolicy="no-referrer" style="width:100%;border-radius:10px">';
    }else{ el.innerHTML=''; }
    // 編集時：既存または新規の添付があれば「消す」ボタンを出す
    var rw=$('mRemoveWrap');
    if(rw){
      var has=pendingMedia||(editTarget&&editTarget.photoUrl&&!removeExisting);
      rw.innerHTML=has?'<button type="button" class="ghost-btn danger" onclick="App.clearMedia()">🗑 添付を消す</button>':'';
    }
  }
  function clearMedia(){ pendingMedia=null; removeExisting=true; if($('mFile'))$('mFile').value=''; renderMediaPreview(); }

  function submitMedia(){
    var title=$('mTitle')?$('mTitle').value.trim():'';
    var text=$('mText').value.trim();
    var hasMediaAfter = pendingMedia || (mode==='edit'&&editTarget&&editTarget.photoUrl&&!removeExisting);
    if(!title && !text && !hasMediaAfter){toast('タイトルか本文、写真・動画を入れてください');return;}
    var btn=$('mSubmit'); btn.disabled=true; btn.textContent='送信中…';
    var fail=function(e){err(e);btn.disabled=false;btn.textContent='送信';};
    if(mode==='edit'){
      run('editReflection',editTarget.reflectionId,user?user.name:null,user?user.password:null,teacherPass,title,text,pickedColor,pendingMedia,removeExisting)
        .then(function(res){
          var u=res.update, card=findCard(u.reflectionId);
          if(card){ card.title=u.title; card.text=u.text; card.color=u.color; card.photoUrl=u.photoUrl; card.mediaType=u.mediaType; card.updatedAt=u.updatedAt; replaceCardDom(card); }
          else refreshBoard();
          closeModal(); toast('保存しました'); lastSig=computeSig();
        }).catch(fail);
    }else{
      run('postReflection',current.board.boardId,postSectionId,user.name,user.password,title,text,pickedColor,pendingMedia)
        .then(function(res){
          var card=res.card; current.cards.push(card); insertCardDom(card);
          closeModal(); toast('投稿しました！'); lastSig=computeSig();
        }).catch(fail);
    }
  }

  return {
    init:login, home:home, login:login, logout:logout,
    pickName:pickName, doLogin:doLogin, teacherLogin:teacherLogin, doTeacherLogin:doTeacherLogin,
    boardList:boardList, openBoard:openBoard, refreshBoard:refreshBoard, leaveBoard:leaveBoard,
    openPost:openPost, openEdit:openEdit, submitMedia:submitMedia, clearMedia:clearMedia,
    addSection:addSection,
    capture:capture,
    closeModal:closeModal,
    // 共有
    _:{run:run,esc:esc,toast:toast,spinner:spinner,view:view,setCrumb:setCrumb,err:err,modal:modal,closeModal:closeModal,fmt:fmt,
       getTeacherPass:function(){return teacherPass;},COLORS:COLORS,subjColor:subjColor}
  };
})();

// ============================================================
//  先生ダッシュボード
// ============================================================
var Teacher=(function(){
  var U=App._;
  var tab='roster';
  var SUBJECTS=['国語','算数・数学','理科','社会','英語','生活','音楽','図工・美術','体育','家庭科','道徳','総合','学活','その他'];

  function open(){ U.setCrumb('先生用'); render(); }
  function go(t){ tab=t; render(); }
  function tabsBar(){
    function b(id,l){return '<button class="tab'+(tab===id?' active':'')+'" onclick="Teacher.go(\''+id+'\')">'+l+'</button>';}
    return '<div class="teacher-tabs">'+b('roster','名簿管理')+b('boards','ボード作成')+b('export','確認・出力')
      +'<button class="tab" onclick="App.logout()">ログアウト</button></div>';
  }
  function render(){ if(tab==='roster')roster();else if(tab==='boards')boards();else exportTab(); }

  // -------- 名簿 --------
  function roster(){
    U.spinner();
    U.run('getStudents').then(function(students){
      var html=tabsBar()+'<div class="section-title"><h2>名簿</h2></div>';
      html+='<div class="row-form">'
        +'<label class="field" style="max-width:110px"><span>出席番号</span><input id="sNum" type="number"></label>'
        +'<label class="field"><span>名前</span><input id="sName" placeholder="山田 太郎"></label>'
        +'<button class="primary-btn" onclick="Teacher.addStudent()">追加</button></div>';
      html+='<div class="row-form"><label class="field"><span>Excelから一括貼り付け（1行1名。「番号[Tab]名前」や「名前」だけでも可）</span>'
        +'<textarea id="bulk" rows="5" placeholder="1\t山田太郎&#10;2\t佐藤花子"></textarea></label>'
        +'<button class="primary-btn" onclick="Teacher.bulkAdd()">一括登録</button></div>';
      if(!students.length){ html+='<div class="empty">まだ生徒がいません。</div>'; }
      else{
        html+='<table><tr><th>番号</th><th>名前</th><th>パスワード</th><th>操作</th></tr>';
        students.forEach(function(s){
          var nm=JSON.stringify(s.name).replace(/"/g,'&quot;');
          html+='<tr><td>'+U.esc(s.number)+'</td><td>'+U.esc(s.name)+'</td>'
            +'<td>'+(s.hasPassword?'設定済み':'<span style="color:#c0a000">未設定</span>')+'</td>'
            +'<td><button class="ghost-btn" onclick="Teacher.resetPw('+nm+')">PWリセット</button> '
            +'<button class="ghost-btn danger" onclick="Teacher.removeStudent('+nm+')">削除</button></td></tr>';
        });
        html+='</table>';
      }
      U.view().innerHTML=html;
    }).catch(U.err);
  }
  function addStudent(){
    var n=document.getElementById('sNum').value, nm=document.getElementById('sName').value.trim();
    if(!nm){U.toast('名前を入力してください');return;}
    U.run('addStudent',n,nm).then(roster).catch(U.err);
  }
  function bulkAdd(){
    var t=document.getElementById('bulk').value; if(!t.trim())return;
    U.run('importStudents',t).then(function(){U.toast('登録しました');roster();}).catch(U.err);
  }
  function removeStudent(name){ if(!confirm(name+' を削除しますか？'))return; U.run('removeStudent',name).then(roster).catch(U.err); }
  function resetPw(name){ if(!confirm(name+' のパスワードをリセットしますか？（次回ログイン時に再設定）'))return; U.run('resetStudentPassword',name).then(function(){U.toast('リセットしました');roster();}).catch(U.err); }

  // -------- ボード作成 --------
  function boards(){
    U.spinner();
    U.run('getBoards', true).then(function(list){
      list=list||[];
      var today=new Date().toISOString().slice(0,10);
      var html=tabsBar()+'<div class="section-title"><h2>ボードを作成</h2></div>';
      html+='<div class="row-form">'
        +'<label class="field"><span>教科</span><select id="bSub">'+SUBJECTS.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select></label>'
        +'<label class="field"><span>単元名</span><input id="bUnit" placeholder="例：ふりこの動き"></label>'
        +'<label class="field"><span>日付</span><input type="date" id="bDate" value="'+today+'"></label>'
        +'<label class="field"><span>タイトル（任意）</span><input id="bTitle" placeholder="未入力なら単元名"></label>'
        +'<button class="primary-btn" onclick="Teacher.createBoard()">作成</button></div>';
      if(list.length){
        html+='<div class="section-title"><h2>作成済みボード</h2></div>'
          +'<p style="color:var(--muted);font-size:13px;margin:-8px 0 12px">「非表示」にすると児童のボード一覧から消えますが、データは残り、先生は印刷も再表示もできます。</p>'
          +'<table><tr><th>教科</th><th>単元</th><th>日付</th><th>タイトル</th><th>状態</th><th>操作</th></tr>';
        list.forEach(function(b){
          var id=JSON.stringify(b.boardId).replace(/"/g,'&quot;');
          var dot='<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+U.subjColor(b.subject)+';margin-right:6px"></span>';
          var rowStyle=b.archived?' style="opacity:.55"':'';
          var state=b.archived?'<span style="color:var(--muted)">🙈 非表示</span>':'<span style="color:#2faf6b">表示中</span>';
          var toggle=b.archived
            ? '<button class="ghost-btn" onclick="Teacher.setArchived('+id+',false)">👁 再表示</button>'
            : '<button class="ghost-btn" onclick="Teacher.setArchived('+id+',true)">🙈 非表示</button>';
          html+='<tr'+rowStyle+'><td>'+dot+U.esc(b.subject)+'</td><td>'+U.esc(b.unit)+'</td><td>'+U.esc(b.date)+'</td><td>'+U.esc(b.title)+'</td>'
            +'<td>'+state+'</td>'
            +'<td><button class="ghost-btn" onclick="App.openBoard('+id+')">開く</button> '
            +toggle+' '
            +'<button class="ghost-btn danger" onclick="Teacher.delBoard('+id+')">削除</button></td></tr>';
        });
        html+='</table>';
      }else{ html+='<div class="empty">まだボードがありません。</div>'; }
      U.view().innerHTML=html;
    }).catch(U.err);
  }
  function createBoard(){
    var sub=document.getElementById('bSub').value, unit=document.getElementById('bUnit').value.trim(),
        date=document.getElementById('bDate').value, title=document.getElementById('bTitle').value.trim();
    if(!unit){U.toast('単元名を入力してください');return;}
    U.run('createBoard',sub,unit,date,title).then(function(){U.toast('作成しました');boards();}).catch(U.err);
  }
  function delBoard(id){ if(!confirm('このボードと投稿・写真をすべて削除します。よろしいですか？'))return; U.run('deleteBoard',id).then(function(){U.toast('削除しました');boards();}).catch(U.err); }
  function setArchived(id, archived){
    U.run('setBoardArchived',id,archived,U.getTeacherPass())
      .then(function(){U.toast(archived?'児童の一覧から非表示にしました':'再表示しました');boards();}).catch(U.err);
  }

  // -------- 確認・出力 --------
  function exportTab(){
    U.spinner();
    Promise.all([U.run('getBoards', true),U.run('getStudents')]).then(function(res){
      var bs=res[0], sts=res[1];
      var html=tabsBar()+'<div class="section-title"><h2>確認・出力</h2></div>';
      html+='<div class="row-form"><label class="field"><span>ボード全体を出力</span><select id="exB">'
        +(bs.length?bs.map(function(b){return '<option value="'+U.esc(b.boardId)+'">'+U.esc(b.subject+' / '+b.unit+' / '+b.date)+'</option>';}).join(''):'<option value="">（ボードなし）</option>')
        +'</select></label>'
        +'<button class="ghost-btn" onclick="Teacher.viewBoard()">画面で確認</button>'
        +'<button class="primary-btn" onclick="Teacher.printBoard()">🖨 印刷／PDF</button></div>';
      html+='<div class="row-form"><label class="field"><span>児童別に出力（その子の全ボードの振り返り）</span><select id="exS">'
        +(sts.length?sts.map(function(s){return '<option value="'+U.esc(s.name)+'">'+U.esc((s.number?s.number+'. ':'')+s.name)+'</option>';}).join(''):'<option value="">（名簿なし）</option>')
        +'</select></label>'
        +'<button class="primary-btn" onclick="Teacher.printStudent()">🖨 印刷／PDF</button></div>';
      html+='<p style="color:var(--muted);font-size:13px">※「印刷／PDF」では、印刷ダイアログで「PDFに保存」を選べばファイル出力できます。すべての記録はスプレッドシートにも自動保存されています。</p>';
      U.view().innerHTML=html;
    }).catch(U.err);
  }
  function viewBoard(){ var id=document.getElementById('exB').value; if(id) App.openBoard(id); }

  function printBoard(){
    var id=document.getElementById('exB').value; if(!id){U.toast('ボードを選んでください');return;}
    U.run('exportBoard',id).then(function(data){
      var b=data.board;
      var html='<div class="print-head"><h1>'+U.esc(b.title)+'</h1>'
        +'<div>'+U.esc(b.subject)+' ／ '+U.esc(b.unit)+' ／ '+U.esc(b.date)+' ／ 投稿数 '+data.cards.length+'件</div></div>';
      // セクションごとに見出しを付けて出力（画面と同じ並び）
      var bySec={};
      data.cards.forEach(function(c){ (bySec[c.sectionId||'']=bySec[c.sectionId||'']||[]).push(c); });
      var cols=(data.sections||[]).slice();
      if((bySec['']||[]).length){ cols.push({sectionId:'',name:'（未分類）'}); }
      cols.forEach(function(sec){
        var cards=bySec[sec.sectionId||'']||[];
        if(!cards.length) return;
        html+='<div class="print-group"><h2>'+U.esc(sec.name)+'（'+cards.length+'件）</h2>';
        cards.forEach(function(c){ html+=printCard(c.studentName,c); });
        html+='</div>';
      });
      doPrint(html);
    }).catch(U.err);
  }
  function printStudent(){
    var name=document.getElementById('exS').value; if(!name){U.toast('児童を選んでください');return;}
    U.run('exportStudent',name).then(function(data){
      var html='<div class="print-head"><h1>'+U.esc(data.studentName)+' さんの振り返り</h1>'
        +'<div>件数 '+data.reflections.length+'件</div></div>';
      data.reflections.forEach(function(r){
        html+='<div class="print-card"><div class="pmeta">'+U.esc(r.subject)+' ／ '+U.esc(r.unit)+' ／ '+U.esc(r.date)+'</div>'
          +(r.title?'<div style="font-weight:700">'+U.esc(r.title)+'</div>':'')
          +(r.text?'<div>'+U.esc(r.text)+'</div>':'')
          +(r.photoUrl?'<img src="'+U.esc(r.photoUrl)+'" referrerpolicy="no-referrer">':'')+'</div>';
      });
      doPrint(html);
    }).catch(U.err);
  }
  function printCard(author,c){
    return '<div class="print-card"><div class="pmeta">'+U.esc(author)+'（❤'+c.likeCount+' / 💬'+c.comments.length+'）</div>'
      +(c.title?'<div style="font-weight:700">'+U.esc(c.title)+'</div>':'')
      +(c.text?'<div>'+U.esc(c.text)+'</div>':'')
      +(c.photoUrl?'<img src="'+U.esc(c.photoUrl)+'" referrerpolicy="no-referrer">':'')
      +(c.comments.length?'<div class="pmeta" style="margin-top:4px">コメント: '+c.comments.map(function(x){return U.esc(x.author+'「'+x.text+'」');}).join(' / ')+'</div>':'')
      +'</div>';
  }
  function doPrint(html){
    document.getElementById('printArea').innerHTML=html;
    setTimeout(function(){ window.print(); },300);
  }

  return {open:open,go:go,addStudent:addStudent,bulkAdd:bulkAdd,removeStudent:removeStudent,resetPw:resetPw,
    createBoard:createBoard,delBoard:delBoard,setArchived:setArchived,viewBoard:viewBoard,printBoard:printBoard,printStudent:printStudent};
})();

window.onload=App.init;
</script>
