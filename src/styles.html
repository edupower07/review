<style>
  :root {
    --bg: #f3ede4;
    --panel: #ffffff;
    --accent: #ff5a5f;
    --accent2: #4a7bd6;
    --text: #2c2c2c;
    --muted: #8a8a8a;
    --border: #e3ddd3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  /* ヘッダー */
  #appHeader {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { font-weight: 700; font-size: 18px; cursor: pointer; white-space: nowrap; }
  .crumb { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-right { display: flex; gap: 8px; }

  main { padding: 20px 16px 60px; max-width: 1200px; margin: 0 auto; }

  /* ボタン */
  button { font-family: inherit; cursor: pointer; border-radius: 10px; font-size: 14px; }
  .primary-btn { background: var(--accent); color: #fff; border: none; padding: 10px 18px; font-weight: 600; }
  .primary-btn:hover { filter: brightness(0.95); }
  .ghost-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 14px; }
  .ghost-btn:hover { background: #f6f1ea; }
  .danger { color: var(--accent); }

  /* 入口（クラスコード） */
  .entry {
    max-width: 420px; margin: 8vh auto; background: var(--panel);
    border-radius: 18px; padding: 32px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  .entry h1 { font-size: 24px; margin: 0 0 4px; }
  .entry p { color: var(--muted); margin: 0 0 24px; }
  .entry input {
    width: 100%; padding: 14px; font-size: 22px; text-align: center; letter-spacing: 6px;
    border: 2px solid var(--border); border-radius: 12px; text-transform: uppercase;
  }
  .entry .primary-btn { width: 100%; margin-top: 16px; padding: 14px; font-size: 16px; }

  /* ボード一覧 */
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; }
  .section-title h2 { margin: 0; font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .board-card {
    background: var(--panel); border-radius: 14px; padding: 18px; cursor: pointer;
    border: 1px solid var(--border); transition: transform .1s, box-shadow .1s; position: relative;
  }
  .board-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
  .board-card .subject-chip {
    display: inline-block; background: var(--accent2); color: #fff; font-size: 12px;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 10px;
  }
  .board-card h3 { margin: 0 0 6px; font-size: 16px; }
  .board-card .meta { color: var(--muted); font-size: 13px; }
  .board-card .del { position: absolute; top: 10px; right: 10px; opacity: 0; }
  .board-card:hover .del { opacity: 1; }

  /* Padlet 風カード一覧（マソンリー） */
  .board-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 18px;
  }
  .board-bar .title { font-weight: 700; font-size: 18px; }
  .board-bar .sub { color: var(--muted); font-size: 13px; }
  .cards { column-width: 240px; column-gap: 16px; }
  .card {
    break-inside: avoid; margin-bottom: 16px; border-radius: 14px; padding: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08); position: relative;
  }
  .card .author { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .card .body { font-size: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .card img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; }
  .card .time { color: rgba(0,0,0,0.45); font-size: 11px; margin-top: 8px; }
  .card .del { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.7);
    border: none; border-radius: 8px; opacity: 0; padding: 2px 7px; }
  .card:hover .del { opacity: 1; }

  /* フローティング追加ボタン */
  .fab {
    position: fixed; right: 24px; bottom: 24px; width: 60px; height: 60px;
    border-radius: 50%; background: var(--accent); color: #fff; border: none;
    font-size: 30px; box-shadow: 0 6px 16px rgba(0,0,0,0.25); z-index: 40;
  }

  /* モーダル */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-card {
    background: var(--panel); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px;
    max-height: 90vh; overflow: auto;
  }
  .modal-card h3 { margin: 0 0 16px; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 14px;
  }
  .preview { width: 100%; border-radius: 10px; margin-bottom: 14px; }
  .color-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.active { border-color: #333; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

  /* 先生画面 */
  .teacher-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); }
  .tab.active { background: var(--text); color: #fff; border-color: var(--text); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: #faf6f0; color: var(--muted); font-weight: 600; }
  .code-pill { font-family: monospace; font-weight: 700; background: #eef3fb; color: var(--accent2); padding: 3px 8px; border-radius: 6px; }
  .row-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin: 16px 0; }
  .row-form .field { margin-bottom: 0; flex: 1; min-width: 140px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 12px 20px; border-radius: 10px; z-index: 200; font-size: 14px;
  }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .spinner { text-align: center; padding: 48px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
