<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('styles'); ?>
</head>
<body>
  <!-- ヘッダー -->
  <header id="appHeader">
    <div class="header-left">
      <span class="logo" onclick="App.goHome()">📌 振り返りボード</span>
      <span id="crumb" class="crumb"></span>
    </div>
    <div class="header-right">
      <button id="teacherBtn" class="ghost-btn" onclick="App.openTeacher()">先生用</button>
    </div>
  </header>

  <main id="view"></main>

  <!-- 投稿モーダル -->
  <div id="postModal" class="modal hidden">
    <div class="modal-card">
      <h3>振り返りを投稿</h3>
      <label class="field">
        <span>名前</span>
        <select id="postStudent"></select>
      </label>
      <label class="field">
        <span>振り返り</span>
        <textarea id="postText" rows="4" placeholder="今日わかったこと、感じたこと…"></textarea>
      </label>
      <label class="field">
        <span>写真（任意）</span>
        <input type="file" id="postPhoto" accept="image/*">
      </label>
      <img id="postPreview" class="preview hidden">
      <div class="color-row" id="colorRow"></div>
      <div class="modal-actions">
        <button class="ghost-btn" onclick="App.closePost()">キャンセル</button>
        <button id="postSubmit" class="primary-btn" onclick="App.submitPost()">投稿する</button>
      </div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast" class="toast hidden"></div>

  <?!= include('javascript'); ?>
</body>
</html>
